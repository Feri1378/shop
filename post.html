<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>پست گروهی محصولات</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#2e9e48;--dark:#1f2326;--muted:#8a9099;--bg:#f4f5f7;--line:#e7e9ed;--warn:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:#1c2024;padding-bottom:96px}
header{background:var(--dark);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
header p{margin:4px 0 0;font-size:12px;color:#c3c8ce;line-height:1.8}
.wrap{padding:12px}
.login{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:none}
.login p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.in{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;font-family:inherit;background:#fff;outline:none;width:100%;min-width:0}
.in:focus{border-color:var(--green)}
.in.bad{border-color:var(--warn);background:#fff5f5}
.btn{height:42px;padding:0 16px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-family:inherit;border:0;font-size:14px;width:100%}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools button{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:13px;color:#1c2024}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:86px 1fr;gap:10px}
.card.failed{border-color:var(--warn)}
.pick{position:relative;width:86px;height:86px;border-radius:12px;background:#eceef1;overflow:hidden;display:grid;place-items:center;color:#8a9099;font-size:12px;text-align:center;cursor:pointer}
.pick img{width:100%;height:100%;object-fit:cover}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.fields{display:flex;flex-direction:column;gap:6px;min-width:0}
textarea.in{height:auto;min-height:56px;padding:8px 10px;resize:vertical;line-height:1.7}
.ext{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ext .th{position:relative;width:44px;height:44px;flex:none}
.ext .th img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ext .th button{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:12px;line-height:20px;padding:0}
.extbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;height:36px;padding:0 10px;border-radius:8px;border:1px dashed #b9bec6;background:#fafbfc;font-size:12px;font-weight:700;color:#1c2024;cursor:pointer}
.extbtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.two{display:flex;gap:6px}
.two>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#333;white-space:nowrap}
.state{font-size:12px;min-height:16px}
.state.ok{color:#15803d}
.state.bad{color:var(--warn)}
.del{align-self:flex-start;background:none;border:0;color:var(--warn);font-family:inherit;font-size:12px;padding:0}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bottom button{width:100%;height:48px;border:0;border-radius:12px;background:var(--dark);color:#fff;font-weight:800;font-size:15px;font-family:inherit}
.bottom button[disabled]{background:#c9cdd3}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:50;transition:.25s;max-width:90%}
.toast.show{transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <h1>📤 پست گروهی محصولات</h1>
  <p>چند عکس انتخاب کنید؛ برای هر عکس یک ردیف ساخته می‌شود. برای هر محصول می‌توانید تا ۹ عکس بیشتر (گالری) هم اضافه کنید. نام، قیمت (به هزار تومان) و موجودی را بنویسید و «ثبت همه» را بزنید.</p>
</header>

<div class="wrap">
  <div class="login" id="loginBox">
    <p>کلید مدیر را یک‌بار وارد کنید (روی همین دستگاه ذخیره می‌شود):</p>
    <input class="in" id="keyIn" type="password" placeholder="کلید مدیر">
    <button class="btn" style="margin-top:8px" onclick="saveKey()">ورود</button>
  </div>

  <div class="tools" id="tools" style="display:none">
    <button onclick="$('multi').click()">📷 انتخاب چند عکس</button>
    <button onclick="addRow()">➕ ردیف خالی</button>
  </div>
  <input type="file" id="multi" accept="image/*" multiple hidden onchange="addFiles(this.files); this.value=''">

  <div id="list"></div>
</div>

<div class="bottom"><button id="submitBtn" disabled onclick="submitAll()">📤 ثبت همه</button></div>
<div class="toast" id="toast"></div>

<script>
/* ======= آدرس Web App اپ اسکریپت (همان آدرس مینی‌اپ) ======= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzQgLIT51gZsVaGpmBdjngJMK2HKZ7vw_IKbL2XIeF9j4-FL1oKe6n1hYaZH4Hex8hU5g/exec';
/* ============================================================ */

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = id => document.getElementById(id);
const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toEn = s => String(s == null ? '' : s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,٬\s]/g, '');

let KEY = '';
try { KEY = localStorage.getItem('adminKey') || ''; } catch (e) {}
let CATS = [];
let ROWS = []; // هر ردیف: {file, preview, name, price, stock, category, badge, state}
let busy = false;

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}

async function api(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ key: KEY }, body)),
  });
  return r.json();
}

function saveKey() {
  KEY = $('keyIn').value.trim();
  try { localStorage.setItem('adminKey', KEY); } catch (e) {}
  load();
}

async function load() {
  if (!KEY) { $('loginBox').style.display = 'block'; return; }
  try {
    const j = await api({ action: 'adminProducts' });
    if (!j.ok) {
      KEY = '';
      try { localStorage.removeItem('adminKey'); } catch (e) {}
      $('loginBox').style.display = 'block';
      toast('کلید مدیر درست نیست');
      return;
    }
    CATS = j.categories || [];
    $('loginBox').style.display = 'none';
    $('tools').style.display = 'flex';
    renderRows();
  } catch (e) {
    toast('خطای ارتباط با سرور، دوباره تلاش کنید');
  }
}

/* ---------- ردیف‌ها ---------- */

function newRow(file) {
  const last = ROWS.length ? ROWS[ROWS.length - 1] : null;
  return {
    file: file || null,
    preview: file ? URL.createObjectURL(file) : '',
    name: '', desc: '', price: '', stock: '',
    category: last ? last.category : '',
    badge: false, state: null, extras: [],
  };
}

function addRow() { ROWS.push(newRow(null)); renderRows(); }

function addFiles(files) {
  Array.from(files || []).forEach(f => ROWS.push(newRow(f)));
  renderRows();
}

function pickFile(i, file) {
  if (!file) return;
  const r = ROWS[i];
  r.file = file;
  r.preview = URL.createObjectURL(file);
  renderRows();
}

function setF(i, field, value) {
  ROWS[i][field] = value;
  if (field === 'name' || field === 'desc' || field === 'price' || field === 'stock') {
    // فقط دکمه‌ی ثبت به‌روز شود، ردیف دوباره ساخته نشود تا کرسر نپرد
    updateSubmit();
  }
}

function delRow(i) {
  ROWS.splice(i, 1);
  renderRows();
}

// عکس‌های بیشتر (گالری) برای هر محصول، حداکثر ۹ عکس
function addExtras(i, files) {
  const r = ROWS[i];
  const list = Array.from(files || []);
  const room = 9 - r.extras.length;
  if (list.length > room) toast('حداکثر ۹ عکس اضافه برای هر محصول');
  list.slice(0, Math.max(0, room)).forEach(f => r.extras.push({ file: f, preview: URL.createObjectURL(f) }));
  renderRows();
}

function delExtra(i, j) {
  ROWS[i].extras.splice(j, 1);
  renderRows();
}

function rowHtml(r, i) {
  const pic = r.preview ? '<img src="' + esc(r.preview) + '" alt="">' : '📷<br>عکس';
  const catOpts = '<option value="">بدون دسته</option>' + CATS.map(c =>
    '<option value="' + esc(c) + '"' + (c === r.category ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
  const stClass = r.state ? (r.state.ok ? 'ok' : 'bad') : '';
  const stMsg = r.state ? r.state.msg : '';
  return '<div class="card' + (r.state && !r.state.ok ? ' failed' : '') + '">' +
    '<label class="pick">' + pic + '<input type="file" accept="image/*" onchange="pickFile(' + i + ', this.files[0])"></label>' +
    '<div class="fields">' +
      '<input class="in" placeholder="نام محصول" value="' + esc(r.name) + '" oninput="setF(' + i + ', \'name\', this.value)">' +
      '<textarea class="in" rows="2" placeholder="توضیحات (اختیاری)" oninput="setF(' + i + ', \'desc\', this.value)">' + esc(r.desc) + '</textarea>' +
      '<div class="ext">' + r.extras.map((e, j) =>
        '<span class="th"><img src="' + esc(e.preview) + '" alt=""><button onclick="delExtra(' + i + ', ' + j + ')">×</button></span>').join('') +
        (r.extras.length < 9 ? '<label class="extbtn">📷 عکس بیشتر (' + fa(r.extras.length) + '/۹)<input type="file" accept="image/*" multiple onchange="addExtras(' + i + ', this.files); this.value=\'\'"></label>' : '') +
      '</div>' +
      '<div class="two">' +
        '<input class="in" inputmode="numeric" placeholder="قیمت (هزار)" value="' + esc(r.price) + '" oninput="setF(' + i + ', \'price\', this.value)">' +
        '<input class="in" inputmode="numeric" placeholder="موجودی" value="' + esc(r.stock) + '" oninput="setF(' + i + ', \'stock\', this.value)">' +
      '</div>' +
      '<div class="two">' +
        '<select class="in" onchange="setF(' + i + ', \'category\', this.value)">' + catOpts + '</select>' +
        '<label class="chk"><input type="checkbox"' + (r.badge ? ' checked' : '') + ' onchange="setF(' + i + ', \'badge\', this.checked)"> پرفروش</label>' +
      '</div>' +
      '<div class="state ' + stClass + '">' + esc(stMsg) + '</div>' +
      '<button class="del" onclick="delRow(' + i + ')">🗑 حذف ردیف</button>' +
    '</div>' +
  '</div>';
}

function renderRows() {
  $('list').innerHTML = ROWS.length
    ? ROWS.map(rowHtml).join('')
    : '<div class="empty">هنوز عکسی انتخاب نشده. از دکمه‌ی «انتخاب چند عکس» شروع کنید.</div>';
  updateSubmit();
}

function updateSubmit() {
  const n = ROWS.length;
  $('submitBtn').disabled = n === 0 || busy;
  $('submitBtn').textContent = n ? '📤 ثبت همه (' + fa(n) + ' محصول)' : '📤 ثبت همه';
}

/* ---------- کنترل و ارسال ---------- */

function validate(r) {
  if (!r.name.trim()) return 'نام محصول خالی است';
  const k = toEn(r.price);
  if (!/^\d+(\.\d+)?$/.test(k) || !(Number(k) > 0) || Number(k) >= 100000) return 'قیمت درست نیست (مثلاً 125)';
  const s = toEn(r.stock);
  if (!/^\d+$/.test(s)) return 'موجودی را به عدد بنویسید';
  return '';
}

// عکس را کوچک و فشرده می‌کنیم تا ارسال سریع باشد
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 800;
      const ratio = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * ratio);
      c.height = Math.round(img.height * ratio);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      resolve(data.split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

function errText(code) {
  const map = {
    name: 'نام خالی است',
    price: 'قیمت درست نیست',
    stock: 'موجودی درست نیست',
    category: 'این دسته وجود ندارد',
    forbidden: 'کلید مدیر درست نیست',
  };
  return map[code] || 'ثبت نشد، دوباره تلاش کنید';
}

async function submitAll() {
  if (busy || !ROWS.length) return;
  busy = true; updateSubmit();
  let ok = 0, fail = 0;
  for (const r of ROWS.slice()) {
    if (r.done) continue;
    const err = validate(r);
    if (err) { r.state = { ok: false, msg: err }; fail++; renderRows(); continue; }
    r.state = { ok: true, msg: 'در حال ثبت...' }; renderRows();
    try {
      const body = {
        action: 'adminAddProduct',
        name: r.name.trim(),
        k: Number(toEn(r.price)),
        stock: Number(toEn(r.stock)),
        category: r.category,
        badge: !!r.badge,
        desc: String(r.desc || '').trim(),
      };
      if (r.file) { body.image = await shrink(r.file); body.mime = 'image/jpeg'; }
      if (r.extras.length) {
        body.gallery = [];
        for (const e of r.extras) body.gallery.push(await shrink(e.file));
      }
      const j = await api(body);
      if (j.ok) { r.done = true; r.state = { ok: true, msg: '✅ ثبت شد' }; ok++; }
      else { r.state = { ok: false, msg: errText(j.error) }; fail++; }
    } catch (e) {
      r.state = { ok: false, msg: 'خطای ارتباط یا عکس، دوباره تلاش کنید' }; fail++;
    }
    renderRows();
  }
  // ردیف‌های ثبت‌شده از فهرست حذف می‌شوند تا فقط موارد باقی‌مانده بماند
  ROWS = ROWS.filter(r => !r.done);
  busy = false;
  renderRows();
  toast('✅ ' + fa(ok) + ' محصول ثبت شد' + (fail ? ' | ' + fa(fail) + ' ردیف ناموفق' : ''));
}

load();
</script>
</body>
</html>
